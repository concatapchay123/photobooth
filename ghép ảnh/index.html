<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tool ghép ảnh 4 slot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Khu vực ghép ảnh">
        <div class="preview-wrap">
          <canvas id="resultCanvas" aria-label="Ảnh sau khi ghép"></canvas>
          <div id="emptyState" class="empty-state">
            <strong>Chưa có ảnh chụp</strong>
            <span>Bật camera hoặc tải ảnh lên để ghép vào template.</span>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Bảng điều khiển">
        <div class="brand-row">
          <div>
            <h1>Ghép ảnh 4 slot</h1>
            <p id="slotStatus">Đang tải template...</p>
          </div>
          <button id="downloadBtn" class="icon-button primary" type="button" disabled title="Tải PNG">
            <span aria-hidden="true">↓</span>
            <span>Tải PNG</span>
          </button>
        </div>

        <div class="camera-box">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <img id="capturedPreview" alt="Ảnh đã chụp" hidden />
          <div id="cameraNotice" class="camera-notice">Đang mở camera...</div>
        </div>

        <div class="control-grid">
          <button id="startCameraBtn" type="button">Mở camera</button>
          <button id="captureBtn" type="button" class="primary" disabled>Chụp ảnh</button>
          <label class="file-control">
            <input id="photoInput" type="file" accept="image/*" />
            Tải ảnh lên
          </label>
        </div>

        <div class="field">
          <label for="templateSelect">Template</label>
          <select id="templateSelect"></select>
        </div>

        <div class="field">
          <label class="file-control wide">
            <input id="templateInput" type="file" accept="image/png,image/webp,image/*" />
            Dùng template khác
          </label>
        </div>

        <div class="segmented" role="group" aria-label="Cách fit ảnh">
          <button id="coverModeBtn" type="button" class="active">Phủ kín</button>
          <button id="containModeBtn" type="button">Vừa khung</button>
        </div>

        <div class="field">
          <label for="zoomRange">Zoom ảnh</label>
          <input id="zoomRange" type="range" min="0.75" max="2.2" step="0.01" value="1" />
        </div>

        <div class="field two-cols">
          <label>
            Dịch ngang
            <input id="offsetXRange" type="range" min="-100" max="100" step="1" value="0" />
          </label>
          <label>
            Dịch dọc
            <input id="offsetYRange" type="range" min="-100" max="100" step="1" value="0" />
          </label>
        </div>

        <label class="toggle-row">
          <input id="mirrorToggle" type="checkbox" checked />
          Lật ngang camera
        </label>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
